<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Multi Add Provider & Service</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#0f172a
);

min-height:100vh;

padding:20px;

color:#fff;

}

.container{

max-width:900px;

margin:auto;

background:#111827;

border-radius:18px;

padding:25px;

box-shadow:

0 0 25px
rgba(0,0,0,.45);

border:

1px solid
rgba(255,255,255,.08);

}

.header{

text-align:center;

margin-bottom:25px;

}

.header h1{

font-size:32px;

font-weight:700;

color:#fff;

}

.header p{

margin-top:8px;

color:#94a3b8;

font-size:14px;

}

.toggle{

display:flex;

justify-content:center;

margin-bottom:25px;

}

.toggle button{

width:220px;

height:48px;

border:none;

border-radius:30px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

background:

linear-gradient(
90deg,
#2563eb,
#06b6d4
);

color:#fff;

}

.row{

display:flex;

gap:15px;

margin-bottom:18px;

flex-wrap:wrap;

}

.col{

flex:1;

min-width:220px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#cbd5e1;

}

input,
select{

width:100%;

height:48px;

padding:12px;

border-radius:10px;

border:

1px solid
#374151;

background:#1f2937;

color:#fff;

font-size:15px;

outline:none;

transition:.25s;

}

input:focus,
select:focus{

border-color:#3b82f6;

box-shadow:

0 0 10px
rgba(59,130,246,.35);

}

.section{

margin-top:28px;

padding-top:22px;

border-top:

1px solid
#374151;

}

.section h2{

font-size:20px;

margin-bottom:18px;

color:#fff;

}

.btn{

width:100%;

height:50px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.btn:hover{

transform:translateY(-2px);

}

.green{

background:
linear-gradient(
90deg,
#22c55e,
#16a34a
);

color:#fff;

}

.blue{

background:
linear-gradient(
90deg,
#2563eb,
#06b6d4
);

color:#fff;

}

@media(max-width:700px){

.header h1{

font-size:26px;

}

.row{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Multi Add Provider & Service</h1>

<p>Professional SMM Panel Manager</p>

</div>

<div class="toggle">

<button
id="modeBtn">

🟢 Auto Fill

</button>

</div>
<div class="row">

<div class="col">

<label>Provider</label>

<select id="provider">

<option value="">Select Provider</option>

</select>

</div>

<div class="col">

<label>Provider Service ID</label>

<input
type="number"
id="provider_service_id"
placeholder="Service ID">

</div>

</div>

<div class="row">

<div class="col">

<label>Service Name</label>

<input
type="text"
id="name"
placeholder="Service Name">

</div>

<div class="col">

<label>Category</label>

<input
type="text"
id="category"
placeholder="Category">

</div>

</div>

<div class="row">

<div class="col">

<label>Rate</label>

<input
type="number"
id="rate"
placeholder="0.00">

</div>

<div class="col">

<label>Minimum</label>

<input
type="number"
id="min"
placeholder="500">

</div>

<div class="col">

<label>Maximum</label>

<input
type="number"
id="max"
placeholder="1000">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn blue"
id="saveService">

💾 Save Service

</button>

</div>

<div class="col">

<button
class="btn"
id="updateService"
style="background:#f59e0b;color:#fff;">

✏️ Update Service

</button>

</div>

<div class="col">

<button
class="btn"
id="deleteService"
style="background:#ef4444;color:#fff;">

🗑 Delete Service

</button>

</div>

</div>

<div class="section">

<h2>Add Provider</h2>

<div class="row">

<div class="col">

<label>Provider Name</label>

<input
type="text"
id="provider_name"
placeholder="HyperPanel">

</div>

<div class="col">

<label>API URL</label>

<input
type="text"
id="api_url"
value="https://hyperpanel.in/api/v2">

</div>

</div>

<div class="row">

<div class="col">

<label>API Key</label>

<input
type="text"
id="api_key"
placeholder="Enter API Key">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn green"
id="addProvider">

➕ Add Provider

</button>

</div>

</div>

<script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

let mode = "auto";
  /* ===========================
   JavaScript
=========================== */

const modeBtn =
document.getElementById("modeBtn");

modeBtn.onclick = ()=>{

if(mode==="auto"){

mode="manual";

modeBtn.innerHTML=
"⚪ Manual Fill";

document.getElementById("provider_service_id").value="";
document.getElementById("name").value="";
document.getElementById("category").value="";
document.getElementById("rate").value="";
document.getElementById("min").value="";
document.getElementById("max").value="";

}else{

mode="auto";

modeBtn.innerHTML=
"🟢 Auto Fill";

}

};

/* ===========================
   Live Category Update
=========================== */

document
.getElementById("name")
.addEventListener("input",()=>{

document
.getElementById("category")
.value=
document
.getElementById("name")
.value;

});

/* ===========================
   Load Providers
=========================== */

async function loadProviders(){

try{

const res =
await fetch(
API+"/api/providers"
);

const data =
await res.json();

const select =
document.getElementById(
"provider"
);

select.innerHTML =
'<option value="">Select Provider</option>';

(data.providers||[])
.forEach(p=>{

select.innerHTML +=

`<option value="${p.id}">
${p.name}
</option>`;

});

}catch(err){

console.log(err);

}

}

/* ===========================
   Auto Fill
=========================== */

async function autoFill(){

if(mode!=="auto") return;

const provider =
document.getElementById("provider").value;

const serviceId =
document.getElementById("provider_service_id").value;

if(!provider || !serviceId) return;

try{

const res =
await fetch(

API+
"/api/providers/"+
provider+
"/services"

);

const data =
await res.json();

const item =
(data.services||[])

.find(x=>

String(x.service)===

String(serviceId)

);

if(!item){

return;

}

document.getElementById("name").value =
item.name || "";

document.getElementById("category").value =
item.category || "";

document.getElementById("rate").value =
item.rate || 0;

document.getElementById("min").value =
item.min || "";

document.getElementById("max").value =
item.max || "";

}catch(err){

console.log(err);

}

}

document
.getElementById("provider")
.onchange = autoFill;

document
.getElementById("provider_service_id")
.oninput = autoFill;
  /* ===========================
   Add Provider
=========================== */

document
.getElementById("addProvider")
.onclick = async()=>{

try{

const res = await fetch(
API+"/api/providers",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

name:
document.getElementById("provider_name").value.trim(),

api_url:
document.getElementById("api_url").value.trim(),

api_key:
document.getElementById("api_key").value.trim()

})
});

const data = await res.json();

alert(data.message || "Provider Added");

loadProviders();

}catch(err){

alert(err.message);

}

};

/* ===========================
   Save Service
=========================== */

document
.getElementById("saveService")
.onclick = async()=>{

try{

const res = await fetch(
API+"/api/services",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value

})

});

const data = await res.json();

alert(data.message || "Service Saved");

}catch(err){

alert(err.message);

}

};

/* ===========================
   Update Service
=========================== */

document
.getElementById("updateService")
.onclick=()=>{

alert(
"Update API Pending"
);

};

/* ===========================
   Delete Service
=========================== */

document
.getElementById("deleteService")
.onclick=()=>{

alert(
"Delete API Pending"
);

};

/* ===========================
   Page Load
=========================== */

window.onload=()=>{

document
.getElementById("api_url").value=
"https://hyperpanel.in/api/v2";

loadProviders();

};

</script>

</body>

</html>
