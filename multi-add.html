<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Multi Add Service

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e293b
);

min-height:100vh;

padding:20px;

color:#fff;

}

.container{

max-width:1100px;

margin:auto;

background:#111827;

border-radius:20px;

overflow:hidden;

box-shadow:
0 0 30px rgba(0,0,0,.45);

border:
1px solid rgba(255,255,255,.08);

}

.header{

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

background:
linear-gradient(
90deg,
#2563eb,
#06b6d4
);

}

.logo{

font-size:28px;

font-weight:700;

}

.version{

padding:8px 16px;

border-radius:30px;

background:
rgba(255,255,255,.2);

font-size:14px;

font-weight:600;

}

.content{

padding:25px;

}

.card{

background:#1f2937;

border-radius:16px;

padding:22px;

border:
1px solid #374151;

margin-bottom:25px;

}

.card-title{

font-size:22px;

font-weight:700;

margin-bottom:20px;

}

.row{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-bottom:18px;

}

.col{

flex:1;

min-width:250px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#cbd5e1;

}
 input,
select{

width:100%;

height:50px;

padding:12px;

border-radius:10px;

background:#111827;

border:
1px solid #374151;

color:#fff;

font-size:15px;

outline:none;

transition:.25s;

}

input:focus,
select:focus{

border-color:#3b82f6;

box-shadow:
0 0 12px rgba(59,130,246,.35);

}

button{

border:none;

cursor:pointer;

transition:.25s;

}

.btn{

width:100%;

height:50px;

border-radius:12px;

font-size:15px;

font-weight:600;

color:#fff;

}

.primary{

background:
linear-gradient(
90deg,
#2563eb,
#06b6d4
);

}

.success{

background:
linear-gradient(
90deg,
#22c55e,
#16a34a
);

}

.toggle-box{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:20px;

flex-wrap:wrap;

}
 .switch{

position:relative;

display:inline-block;

width:60px;

height:34px;

}

.switch input{

display:none;

}

.slider{

position:absolute;

cursor:pointer;

top:0;

left:0;

right:0;

bottom:0;

background:#374151;

border-radius:34px;

transition:.3s;

}

.slider:before{

content:"";

position:absolute;

width:26px;

height:26px;

left:4px;

bottom:4px;

background:#fff;

border-radius:50%;

transition:.3s;

}

input:checked+.slider{

background:#22c55e;

}

input:checked+.slider:before{

transform:translateX(26px);

}

.mode-text{

font-size:15px;

font-weight:600;

color:#cbd5e1;

}

@media(max-width:768px){

.header{

flex-direction:column;

text-align:center;

}

.row{

flex-direction:column;

}

.col{

min-width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">

🚀 Multi Add

</div>

<div class="version">

Professional v5

</div>

</div>

<div class="content">
 <div class="card">

<div class="card-title">

🔗 Add Provider

</div>

<div class="row">

<div class="col">

<label>

Provider Name

</label>

<input
type="text"
id="provider_name"
placeholder="HyperPanel">

</div>

<div class="col">

<label>

API URL

</label>

<input
type="text"
id="api_url"
value="https://hyperpanel.in/api/v2">

</div>

</div>

<div class="row">

<div class="col">

<label>

API Key

</label>

<input
type="text"
id="api_key"
placeholder="Enter API Key">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn primary"
id="addProvider">

💾 Save Provider

</button>

</div>

</div>

 </div>
 <div class="card">

<div class="toggle-box">

<div class="card-title">

📦 Add Service

</div>

<div
style="
display:flex;
align-items:center;
gap:12px;
">

<label class="switch">

<input
type="checkbox"
id="autoToggle">

<span
class="slider">

</span>

</label>

<span
id="modeText"
class="mode-text">

Auto Fill OFF

</span>

</div>

</div>

<div class="row">

<div class="col">

<label>

Provider

</label>

<select
id="provider">

<option value="">

Select Provider

</option>

</select>

</div>

<div class="col">

<label>

Provider Service ID

</label>

<input
type="number"
id="provider_service_id"
placeholder="5025">

</div>

</div>

<div class="row">

<div class="col">

<label>

Service Name

</label>

<input
type="text"
id="name"
placeholder="Instagram Views">

</div>

<div class="col">

<label>

Category

</label>

<input
type="text"
id="category"
placeholder="Instagram">

</div>

</div>

<div class="row">

<div class="col">

<label>

Rate

</label>

<input
type="number"
step="0.0001"
id="rate"
placeholder="0.00">

</div>

<div class="col">

<label>

Minimum

</label>

<input
type="number"
id="min"
placeholder="500">

</div>

</div>

<div class="row">

<div class="col">

<label>

Maximum

</label>

<input
type="number"
id="max"
placeholder="1000">

</div>

<div class="col">

<button
class="btn success"
id="addService">

➕ Add Service

</button>

</div>

</div>

 </div>
 <script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

let autoFill=false;

let syncing=false;

let services=[];

const toggle=
document.getElementById("autoToggle");

const modeText=
document.getElementById("modeText");

const provider=
document.getElementById("provider");

const providerServiceId=
document.getElementById("provider_service_id");

const serviceName=
document.getElementById("name");

const category=
document.getElementById("category");

const providerName=
document.getElementById("provider_name");

const rate=
document.getElementById("rate");

const min=
document.getElementById("min");

const max=
document.getElementById("max");

/* ==========================================
   AUTO FILL
========================================== */

toggle.onchange=function(){

autoFill=this.checked;

if(autoFill){

modeText.innerHTML="Auto Fill ON";

providerServiceId.value="5025";

rate.value="0";

min.value="500";

max.value="1000";

serviceName.value=".view";

category.value=".view";

providerName.value=".view";

}else{

modeText.innerHTML="Auto Fill OFF";

providerServiceId.value="";

serviceName.value="";

category.value="";

providerName.value="";

rate.value="";

min.value="";

max.value="";

}

};

/* ==========================================
   AUTO SYNC
========================================== */

function syncFields(value){

if(syncing)return;

syncing=true;

const text=value.replace(/\.view$/,"");

serviceName.value=text+".view";

category.value=text+".view";

providerName.value=text+".view";
const providerCode = text.split(" ")[0].toLowerCase();

for (const option of provider.options) {

    if (option.text.toLowerCase() === providerCode) {

        provider.value = option.value;

        break;

    }

}
syncing=false;

}

serviceName.addEventListener(
"input",
function(){

if(!autoFill)return;

syncFields(this.value);

}
);

category.addEventListener(
"input",
function(){

if(!autoFill)return;

syncFields(this.value);

}
);

providerName.addEventListener(
"input",
function(){

if(!autoFill)return;

syncFields(this.value);

}
);
  /* ==========================================
   LOAD PROVIDERS
========================================== */

async function loadProviders(){

try{

const res=
await fetch(
API+"/api/providers"
);

const data=
await res.json();

provider.innerHTML=
'<option value="">Select Provider</option>';

(data.providers||[]).forEach(p=>{

provider.innerHTML+=`

<option value="${p.id}">

${p.name}

</option>

`;

});

}catch(err){

console.log(err);

}

}

/* ==========================================
   ADD PROVIDER
========================================== */

document
.getElementById("addProvider")
.onclick=async()=>{

try{

const body={

name:
providerName.value.trim(),

api_url:
document
.getElementById("api_url")
.value
.trim(),

api_key:
document
.getElementById("api_key")
.value
.trim()

};

const res=
await fetch(
API+"/api/providers",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(body)

}

);

const data=
await res.json();

alert(
data.message||
"Provider Added Successfully"
);

providerName.value="";

document
.getElementById("api_key").value="";

await loadProviders();

}catch(err){

alert(err.message);

}

};
  /* ==========================================
   ADD SERVICE
========================================== */

document
.getElementById("addService")
.onclick=async()=>{

try{

const body={

provider_id:Number(
provider.value
),

provider_service_id:Number(
providerServiceId.value
),

name:
serviceName.value.trim(),

category:
category.value.trim(),

rate:Number(
rate.value
),

min:Number(
min.value
),

max:Number(
max.value
)

};

const res=
await fetch(
API+"/api/services",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(body)

}

);

const data=
await res.json();

alert(
data.message||
"Service Added Successfully"
);

if(!autoFill){

provider.value="";

providerServiceId.value="";

serviceName.value="";

category.value="";

rate.value="";

min.value="";

max.value="";

}

}catch(err){

alert(err.message);

}

};
  /* ==========================================
   PAGE LOAD
========================================== */

window.onload=async()=>{

toggle.checked=false;

autoFill=false;

modeText.innerHTML=
"Auto Fill OFF";

document
.getElementById("api_url")
.value=
"https://hyperpanel.in/api/v2";

await loadProviders();

};

/* ==========================================
   PROVIDER CHANGE
========================================== */

provider.onchange=function(){

if(!autoFill)return;

providerServiceId.value="5025";

rate.value="0";

min.value="500";

max.value="1000";

};

/* ==========================================
   OPTIONAL RESET
========================================== */

function clearServiceForm(){

provider.value="";

providerServiceId.value="";

serviceName.value="";

category.value="";

rate.value="";

min.value="";

max.value="";

}

/* ==========================================
   END PART 9
========================================== */
  /* ==========================================
   HTML END
========================================== */

</script>

</body>

 </html>
