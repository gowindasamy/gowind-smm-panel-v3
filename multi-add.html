<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Multi Add</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#08111f;

background-image:

radial-gradient(circle at top left,
rgba(147,51,234,.18),
transparent 35%),

radial-gradient(circle at top right,
rgba(6,182,212,.15),
transparent 35%),

radial-gradient(circle at bottom right,
rgba(37,99,235,.18),
transparent 40%);

color:#fff;

min-height:100vh;

}

.container{

width:95%;

max-width:900px;

margin:20px auto;

}

.card{

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

padding:20px;

margin-bottom:20px;

}

h2{

text-align:center;

margin-bottom:20px;

font-size:28px;

background:linear-gradient(
90deg,
#3b82f6,
#06b6d4);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

label{

display:block;

margin-top:15px;

margin-bottom:8px;

font-weight:bold;

}

input,
select{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

color:#fff;

font-size:15px;

}

select option{

background:#0f172a;

color:#fff;

}

button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:14px;

font-size:16px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(
90deg,
#2563eb,
#8b5cf6,
#06b6d4);

color:#fff;

}

.mode{

display:flex;

justify-content:space-between;

align-items:center;

padding:15px;

margin-bottom:20px;

background:rgba(255,255,255,.05);

border-radius:15px;

}

.switch{

position:relative;

display:inline-block;

width:60px;

height:34px;

}

.switch input{

display:none;

}

.slider{

position:absolute;

cursor:pointer;

top:0;

left:0;

right:0;

bottom:0;

background:#d1d5db;

transition:.4s;

border-radius:34px;

}

.slider:before{

position:absolute;

content:"";

height:26px;

width:26px;

left:4px;

bottom:4px;

background:white;

transition:.4s;

border-radius:50%;

}

input:checked + .slider{

background:#c026d3;

}

input:checked + .slider:before{

transform:translateX(26px);

}

#modeText{

font-size:16px;

font-weight:bold;

color:#22c55e;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Multi Add</h2>

<div class="mode">

<div>

Mode :
<span id="modeText">

Auto Fill

</span>

</div>

<label class="switch">

<input
type="checkbox"
id="mode"
checked>

<span class="slider">

</span>

</label>

</div>

<label>

Provider

</label>

<select id="provider">

<option>

Loading...

</option>

</select>

<label>

Provider Service ID

</label>

<input
type="number"
id="provider_service_id"
placeholder="Provider Service ID">

<label>

Service Name

</label>

<input
type="text"
id="name"
placeholder="Service Name">

<label>

Category

</label>

<input
type="text"
id="category"
placeholder="Category">
<label>

Rate (Per 1000)

</label>

<input
type="number"
id="rate"
placeholder="Rate">

<label>

Minimum Quantity

</label>

<input
type="number"
id="min"
placeholder="Minimum">

<label>

Maximum Quantity

</label>

<input
type="number"
id="max"
placeholder="Maximum">

<button
id="saveService">

<i class="fa-solid fa-floppy-disk"></i>

Save Service

</button>

</div>

<div class="card">

<h2>

Add Provider

</h2>

<label>

Provider Name

</label>

<input
type="text"
id="provider_name"
placeholder="Provider Name">

<label>

API URL

</label>

<input
type="text"
id="api_url"
placeholder="https://example.com/api/v2">

<label>

API Key

</label>

<input
type="text"
id="api_key"
placeholder="API Key">

<button
id="saveProvider">

<i class="fa-solid fa-plus"></i>

Add Provider

</button>

</div>

</div>

<script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

const mode =
document.getElementById("mode");

const modeText =
document.getElementById("modeText");

mode.addEventListener("change",()=>{

if(mode.checked){

modeText.innerText =
"Auto Fill";

}else{

modeText.innerText =
"Manual Fill";

}

});

async function loadProviders(){

const res =
await fetch(API+"/api/providers");

const data =
await res.json();

const provider =
document.getElementById("provider");

provider.innerHTML="";

data.providers.forEach(item=>{

provider.innerHTML += `

<option value="${item.id}">

${item.name}

</option>

`;

});

}

loadProviders();
  /* ===========================
   AUTO / MANUAL MODE
=========================== */

const fields = [
"provider_service_id",
"name",
"category",
"rate",
"min",
"max"
];

mode.addEventListener("change",()=>{

modeText.innerText =
mode.checked
? "Auto Fill"
: "Manual Fill";

});

/* ===========================
   AUTO IMPORT
=========================== */

async function autoFill(){

if(!mode.checked) return;

const provider =
document.getElementById("provider").value;

const serviceId =
document
.getElementById("provider_service_id")
.value;

if(!provider || !serviceId) return;

try{

const res = await fetch(

API+
"/api/providers/"+
provider+
"/services"

);

const data =
await res.json();

const service =
(data.services||[])
.find(item=>

String(item.service)===String(serviceId)

);

if(!service){

alert("Service Not Found");

return;

}

document.getElementById("name").value =
service.name || "";

document.getElementById("category").value =
service.category || "";

document.getElementById("rate").value =
service.rate || "";

document.getElementById("min").value =
service.min || "";

document.getElementById("max").value =
service.max || "";

}catch(err){

console.log(err);

}

}

document
.getElementById("provider_service_id")
.addEventListener("change",autoFill);

document
.getElementById("provider")
.addEventListener("change",autoFill);

/* ===========================
   ADD PROVIDER
=========================== */

document
.getElementById("saveProvider")
.onclick = async()=>{

const res = await fetch(
API+"/api/providers",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

name:
document
.getElementById("provider_name")
.value,

api_url:
document
.getElementById("api_url")
.value,

api_key:
document
.getElementById("api_key")
.value

})
});

const data =
await res.json();

alert(data.message||data.error);

loadProviders();

};
  /* ===========================
   SAVE SERVICE
=========================== */

document
.getElementById("saveService")
.onclick = async()=>{

try{

const res = await fetch(
API+"/api/services",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value
)

})
});

const data =
await res.json();

alert(
data.message ||
data.error
);

if(data.success){

document.getElementById("provider_service_id").value="";

document.getElementById("name").value="";

document.getElementById("category").value="";

document.getElementById("rate").value="";

document.getElementById("min").value="";

document.getElementById("max").value="";

}

}catch(err){

alert(err.message);

}

};

/* ===========================
   AUTO CATEGORY
=========================== */

document
.getElementById("name")
.addEventListener("input",()=>{

if(
document
.getElementById("category")
.value.trim()===""
){

document
.getElementById("category")
.value=
document
.getElementById("name")
.value;

}

});

document
.getElementById("category")
.addEventListener("input",()=>{

if(
document
.getElementById("name")
.value.trim()===""
){

document
.getElementById("name")
.value=
document
.getElementById("category")
.value;

}

});

/* ===========================
   AUTO REFRESH
=========================== */

setInterval(
loadProviders,
30000
);

</script>

</body>

</html>
