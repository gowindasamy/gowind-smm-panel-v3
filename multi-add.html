<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multi Add Service</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

.row{
display:flex;
gap:10px;
margin-bottom:15px;
}

.col{
flex:1;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
padding:12px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

.save{
background:#2196F3;
color:#fff;
}

.provider{
background:#4CAF50;
color:#fff;
}

.mode{
display:flex;
gap:20px;
margin-bottom:20px;
font-weight:bold;
}

hr{
margin:25px 0;
}

</style>

</head>

<body>

<div class="container">

<h2>Multi Add Provider & Service</h2>

<div class="mode">

<label>
<input
type="radio"
name="mode"
value="auto"
checked>
Auto Fill
</label>

<label>
<input
type="radio"
name="mode"
value="manual">
Manual Fill
</label>

</div>

<div class="row">

<div class="col">

<label>Provider</label>

<select id="provider">

<option value="">
Select Provider
</option>

</select>

</div>

<div class="col">

<label>Provider Service ID</label>

<input
type="number"
id="provider_service_id"
value="5025">

</div>

</div>

<div class="row">

<div class="col">

<label>Service Name</label>

<input
type="text"
id="name"
value=".view">

</div>

<div class="col">

<label>Category</label>

<input
type="text"
id="category"
value=".view">

</div>

</div>

<div class="row">

<div class="col">

<label>Rate</label>

<input
type="number"
id="rate"
value="0">

</div>

<div class="col">

<label>Minimum</label>

<input
type="number"
id="min"
value="500">

</div>

<div class="col">

<label>Maximum</label>

<input
type="number"
id="max"
value="1000">

</div>

</div>
<hr>

<h3>Add Provider</h3>

<div class="row">

<div class="col">

<label>Provider Name</label>

<input
type="text"
id="provider_name"
placeholder="HyperPanel">

</div>

<div class="col">

<label>API URL</label>

<input
type="text"
id="api_url"
value="https://hyperpanel.in/api/v2">

</div>

</div>

<div class="row">

<div class="col">

<label>API Key</label>

<input
type="text"
id="api_key"
placeholder="Enter API Key">

</div>

</div>

<div class="row">

<button
class="provider"
id="addProvider">

Add Provider

</button>

<button
class="save"
id="saveService">

Save Service

</button>

</div>

</div>

<script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

let mode = "auto";

document
.querySelectorAll(
'input[name="mode"]'
)
.forEach(r=>{

r.onchange=()=>{

mode=r.value;

};

});

async function loadProviders(){

try{

const res =
await fetch(
API+"/api/providers"
);

const data =
await res.json();

const select =
document.getElementById(
"provider"
);

select.innerHTML =
'<option value="">Select Provider</option>';

(data.providers||[])
.forEach(p=>{

select.innerHTML += `
<option value="${p.id}">
${p.name}
</option>`;

});

}catch(err){

console.log(err);

}

}
  async function autoFill(){

if(mode!=="auto") return;

const provider =
document.getElementById(
"provider"
).value;

const service =
document.getElementById(
"provider_service_id"
).value;

if(!provider || !service) return;

try{

const res =
await fetch(
API+
"/api/providers/"
+
provider+
"/services"
);

const data =
await res.json();

const services =
data.services || [];

const item =
services.find(s=>

String(s.service)==
String(service)

);

if(!item){

alert(
"Service Not Found"
);

return;

}

document
.getElementById("name")
.value =
item.name || ".view";

document
.getElementById("category")
.value =
item.category || ".view";

document
.getElementById("rate")
.value =
item.rate || 0;

document
.getElementById("min")
.value =
item.min || 500;

document
.getElementById("max")
.value =
item.max || 1000;

}catch(err){

console.log(err);

}

}

document
.getElementById("provider")
.addEventListener(
"change",
autoFill
);

document
.getElementById(
"provider_service_id"
)
.addEventListener(
"input",
autoFill
);

document
.getElementById(
"addProvider"
)
.onclick = async()=>{

try{

const res =
await fetch(
API+"/api/providers",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

name:
document.getElementById(
"provider_name"
).value,

api_url:
document.getElementById(
"api_url"
).value,

api_key:
document.getElementById(
"api_key"
).value

})

});

const data =
await res.json();

alert(
data.message ||
"Provider Added"
);

loadProviders();

}catch(err){

alert(err.message);

}

};
  /* ===========================
   SAVE SERVICE
=========================== */

document
.getElementById("saveService")
.onclick = async()=>{

try{

const res = await fetch(
API+"/api/services",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value

})

});

const data = await res.json();

alert(
data.message ||
data.error ||
"Service Saved"
);

if(data.success){

document.getElementById("provider_service_id").value="5025";
document.getElementById("name").value=".view";
document.getElementById("category").value=".view";
document.getElementById("rate").value="0";
document.getElementById("min").value="500";
document.getElementById("max").value="1000";

}

}catch(err){

alert(err.message);

}

};

/* ===========================
   AUTO CATEGORY
=========================== */

document
.getElementById("name")
.addEventListener("input",()=>{

if(mode==="auto"){

document.getElementById("category").value=
document.getElementById("name").value;

}

});

/* ===========================
   PAGE LOAD
=========================== */

window.onload=()=>{

loadProviders();

document.getElementById("api_url").value=
"https://hyperpanel.in/api/v2";

};

</script>

</body>

</html>
