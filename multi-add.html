<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SMM Panel Admin

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e293b
);

min-height:100vh;

padding:20px;

color:#fff;

}

.container{

max-width:1100px;

margin:auto;

background:#111827;

border-radius:20px;

overflow:hidden;

box-shadow:
0 0 30px
rgba(0,0,0,.45);

border:
1px solid
rgba(255,255,255,.08);

}

.header{

background:
linear-gradient(
90deg,
#2563eb,
#06b6d4
);

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:15px;

}

.logo{

font-size:30px;

font-weight:700;

}

.version{

padding:8px 18px;

border-radius:30px;

background:
rgba(255,255,255,.18);

font-size:14px;

font-weight:600;

}

.content{

padding:25px;

}

.card{

background:#1f2937;

border:
1px solid
#374151;

border-radius:15px;

padding:22px;

margin-bottom:25px;

}

.card-title{

font-size:22px;

font-weight:700;

margin-bottom:20px;

}

.row{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-bottom:18px;

}

.col{

flex:1;

min-width:250px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#cbd5e1;

}

input,
select{

width:100%;

height:50px;

padding:12px;

border-radius:10px;

background:#111827;

color:#fff;

border:
1px solid
#374151;

outline:none;

font-size:15px;

transition:.25s;

}

input:focus,
select:focus{

border-color:#3b82f6;

box-shadow:
0 0 12px
rgba(59,130,246,.35);

}

button{

border:none;

cursor:pointer;

transition:.25s;

}
 .btn{

height:50px;

padding:0 20px;

border-radius:12px;

font-size:15px;

font-weight:600;

color:#fff;

}

.btn:hover{

transform:
translateY(-2px);

}

.primary{

background:
linear-gradient(
90deg,
#2563eb,
#06b6d4
);

}

.success{

background:
linear-gradient(
90deg,
#22c55e,
#16a34a
);

}

.warning{

background:
linear-gradient(
90deg,
#f59e0b,
#d97706
);

}

.danger{

background:
linear-gradient(
90deg,
#ef4444,
#dc2626
);

}

.toggle-box{

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

flex-wrap:wrap;

margin-bottom:25px;

}

.switch{

position:relative;

display:inline-block;

width:62px;

height:34px;

}

.switch input{

display:none;

}

.slider{

position:absolute;

cursor:pointer;

top:0;

left:0;

right:0;

bottom:0;

background:#374151;

transition:.3s;

border-radius:34px;

}

.slider:before{

position:absolute;

content:"";

height:26px;

width:26px;

left:4px;

bottom:4px;

background:white;

transition:.3s;

border-radius:50%;

}

input:checked+.slider{

background:#22c55e;

}

input:checked+.slider:before{

transform:translateX(28px);

}

.mode-text{

font-size:15px;

font-weight:600;

color:#cbd5e1;

}

@media(max-width:768px){

.header{

justify-content:center;

text-align:center;

}

.logo{

font-size:24px;

}

.row{

flex-direction:column;

}

.col{

min-width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">

🚀 SMM Panel

</div>

<div class="version">

Professional v3.0

</div>

</div>

<div class="content">
 <div class="card">

<div class="toggle-box">

<div class="card-title">

📦 Add Service

</div>

<div
style="
display:flex;
align-items:center;
gap:12px;
">

<label class="switch">

<input
type="checkbox"
id="autoToggle"
checked>

<span
class="slider">

</span>

</label>

<span
id="modeText"
class="mode-text">

Auto Fill ON

</span>

</div>

</div>

<div class="row">

<div class="col">

<label>

Provider

</label>

<select
id="provider">

<option value="">

Select Provider

</option>

</select>

</div>

<div class="col">

<label>

Provider Service ID

</label>

<input
type="number"
id="provider_service_id"
placeholder="5025">

</div>

</div>

<div class="row">

<div class="col">

<label>

Service Name

</label>

<input
type="text"
id="name"
placeholder="Instagram Views">

</div>

<div class="col">

<label>

Category

</label>

<input
type="text"
id="category"
placeholder="Instagram">

</div>

</div>

<div class="row">

<div class="col">

<label>

Rate

</label>

<input
type="number"
step="0.0001"
id="rate"
placeholder="0">

</div>

<div class="col">

<label>

Minimum

</label>

<input
type="number"
id="min"
placeholder="100">

</div>

<div class="col">

<label>

Maximum

</label>

<input
type="number"
id="max"
placeholder="100000">

</div>

</div>
<div class="row">

<div class="col">

<button
class="btn success"
id="addService"
style="width:100%;">

➕ Add Service

</button>

</div>

</div>

</div>

<div class="card">

<div class="card-title">

🔗 Add Provider

</div>

<div class="row">

<div class="col">

<label>

Provider Name

</label>

<input
type="text"
id="provider_name"
placeholder="HyperPanel">

</div>

<div class="col">

<label>

API URL

</label>

<input
type="text"
id="api_url"
value="https://hyperpanel.in/api/v2">

</div>

</div>

<div class="row">

<div class="col">

<label>

API Key

</label>

<input
type="text"
id="api_key"
placeholder="Enter API Key">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn primary"
id="addProvider"
style="width:100%;">

💾 Save Provider

</button>

</div>

</div>

</div>

<script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

let mode="auto";

let selectedService=null;

const toggle=
document.getElementById(
"autoToggle"
);

const modeText=
document.getElementById(
"modeText"
);
 /* ===========================
   AUTO FILL ON / OFF
=========================== */

toggle.onchange=()=>{

if(toggle.checked){

mode="auto";

modeText.innerHTML=
"Auto Fill ON";

autoFill();

}else{

mode="manual";

modeText.innerHTML=
"Auto Fill OFF";

[
"provider_service_id",
"name",
"category",
"rate",
"min",
"max"
].forEach(id=>{

document.getElementById(id).value="";

});

}

};

/* ===========================
   LIVE CATEGORY UPDATE
=========================== */

document
.getElementById("name")
.addEventListener(
"input",
e=>{

if(mode==="manual"){

document
.getElementById("category")
.value=
e.target.value;

}

}
);

/* ===========================
   LOAD PROVIDERS
=========================== */

async function loadProviders(){

try{

const res=
await fetch(
API+"/api/providers"
);

const data=
await res.json();

const select=
document.getElementById(
"provider"
);

select.innerHTML=
'<option value="">Select Provider</option>';

(data.providers||[])
.forEach(p=>{

select.innerHTML+=`

<option value="${p.id}">
${p.name}
</option>

`;

});

}catch(err){

console.error(err);

}

}
 /* ===========================
   AUTO FILL
=========================== */

async function autoFill(){

if(mode!=="auto") return;

const provider=
document.getElementById("provider").value;

const serviceId=
document.getElementById("provider_service_id").value;

if(!provider || !serviceId) return;

try{

const res=
await fetch(

API+
"/api/providers/"+
provider+
"/services"

);

const data=
await res.json();

const item=
(data.services||[])
.find(x=>

String(x.service)===

String(serviceId)

);

if(!item){

return;

}

document.getElementById("name").value=
item.name||"";

document.getElementById("category").value=
item.category||"";

document.getElementById("rate").value=
item.rate||0;

document.getElementById("min").value=
item.min||"";

document.getElementById("max").value=
item.max||"";

}catch(err){

console.error(err);

}

}

document
.getElementById("provider")
.onchange=autoFill;

document
.getElementById("provider_service_id")
.oninput=autoFill;
 /* ===========================
   ADD SERVICE
=========================== */

document
.getElementById("addService")
.onclick = async()=>{

try{

const res = await fetch(
API + "/api/services",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value
)

})

});

const data = await res.json();

alert(
data.message ||
"Service Added Successfully"
);

if(mode==="manual"){

[
"provider_service_id",
"name",
"category",
"rate",
"min",
"max"
].forEach(id=>{

document.getElementById(id).value="";

});

}

}catch(err){

alert(err.message);

}

};
 /* ===========================
   ADD PROVIDER
=========================== */

document
.getElementById("addProvider")
.onclick = async()=>{

try{

const res = await fetch(
API + "/api/providers",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("provider_name").value.trim(),

api_url:
document.getElementById("api_url").value.trim(),

api_key:
document.getElementById("api_key").value.trim()

})

});

const data = await res.json();

alert(
data.message ||
"Provider Added Successfully"
);

document.getElementById("provider_name").value="";
document.getElementById("api_key").value="";

loadProviders();

}catch(err){

alert(err.message);

}

};

/* ===========================
   PAGE LOAD
=========================== */

window.onload=()=>{

document.getElementById("api_url").value=
"https://hyperpanel.in/api/v2";

loadProviders();

};

</script>

</body>

</html>
