<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SMM Panel • Multi Add
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e293b
);

min-height:100vh;

padding:20px;

color:#fff;

}

.container{

max-width:1100px;

margin:auto;

background:#111827;

border-radius:18px;

overflow:hidden;

box-shadow:

0 0 35px
rgba(0,0,0,.45);

border:

1px solid
rgba(255,255,255,.08);

}

.header{

padding:25px;

background:

linear-gradient(
90deg,
#2563eb,
#06b6d4
);

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

}

.logo{

font-size:30px;

font-weight:700;

}

.version{

font-size:14px;

background:
rgba(255,255,255,.18);

padding:8px 15px;

border-radius:30px;

}

.content{

padding:25px;

}

.card{

background:#1f2937;

border-radius:15px;

padding:20px;

margin-bottom:25px;

border:

1px solid
#374151;

}

.card-title{

font-size:20px;

font-weight:600;

margin-bottom:20px;

}

.row{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-bottom:18px;

}

.col{

flex:1;

min-width:250px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#cbd5e1;

}

input,
select{

width:100%;

height:48px;

padding:12px;

border-radius:10px;

background:#111827;

color:#fff;

font-size:15px;

border:

1px solid
#374151;

outline:none;

transition:.25s;

}

input:focus,
select:focus{

border-color:#3b82f6;

box-shadow:

0 0 12px
rgba(59,130,246,.35);

}

.btn{

height:50px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:15px;

font-weight:600;

transition:.25s;

}

.btn:hover{

transform:
translateY(-2px);

}

.primary{

background:

linear-gradient(
90deg,
#2563eb,
#06b6d4
);

color:#fff;

}

.success{

background:

linear-gradient(
90deg,
#22c55e,
#16a34a
);

color:#fff;

}

.warning{

background:

linear-gradient(
90deg,
#f59e0b,
#d97706
);

color:#fff;

}

.danger{

background:

linear-gradient(
90deg,
#ef4444,
#dc2626
);

color:#fff;

}

.toggle{

display:flex;

justify-content:center;

margin-bottom:20px;

}

.toggle button{

width:230px;

height:50px;

border:none;

border-radius:30px;

font-size:16px;

font-weight:700;

cursor:pointer;

background:

linear-gradient(
90deg,
#22c55e,
#16a34a
);

color:#fff;

}

@media(max-width:768px){

.header{

justify-content:center;

text-align:center;

gap:12px;

}

.logo{

font-size:24px;

}

.row{

flex-direction:column;

}

.col{

min-width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
 SMM Panel
</div>

<div class="version">
Professional v2.0
</div>

</div>

<div class="content">
  <div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:20px;">

<div class="card-title">

📦 Service Manager

</div>

<div class="toggle">

<button
id="modeBtn">

🟢 Auto Fill

</button>

</div>

</div>

<div class="row">

<div class="col">

<label>

Provider

</label>

<select
id="provider">

<option value="">

Select Provider

</option>

</select>

</div>

<div class="col">

<label>

Provider Service ID

</label>

<input
type="number"
id="provider_service_id"
placeholder="5025">

</div>

</div>

<div class="row">

<div class="col">

<label>

Service Name

</label>

<input
type="text"
id="name"
placeholder=".view">

</div>

<div class="col">

<label>

Category

</label>

<input
type="text"
id="category"
placeholder=".view">

</div>

</div>

<div class="row">

<div class="col">

<label>

Rate

</label>

<input
type="number"
step="0.0001"
id="rate"
placeholder="0">

</div>

<div class="col">

<label>

Minimum

</label>

<input
type="number"
id="min"
placeholder="500">

</div>

<div class="col">

<label>

Maximum

</label>

<input
type="number"
id="max"
placeholder="1000">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn primary"
id="saveService">

💾 Save Service

</button>

</div>

<div class="col">

<button
class="btn warning"
id="updateService">

✏️ Update Service

</button>

</div>

<div class="col">

<button
class="btn danger"
id="deleteService">

🗑 Delete Service

</button>

</div>

</div>

</div>

<div class="card">

<div class="card-title">

🔗 Provider Manager

</div>
<div class="row">

<div class="col">

<label>

Provider Name

</label>

<input
type="text"
id="provider_name"
placeholder="HyperPanel">

</div>

<div class="col">

<label>

API URL

</label>

<input
type="text"
id="api_url"
value="https://hyperpanel.in/api/v2">

</div>

</div>

<div class="row">

<div class="col">

<label>

API Key

</label>

<input
type="password"
id="api_key"
placeholder="Enter HyperPanel API Key">

</div>

</div>

<div class="row">

<div class="col">

<button
class="btn success"
id="addProvider">

➕ Add Provider

</button>

</div>

</div>

</div>

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:20px;">

<div class="card-title">

📋 Service Search

</div>

<button
class="btn primary"
id="refreshServices"
style="width:180px;">

🔄 Refresh

</button>

</div>

<div class="row">

<div class="col">

<label>

Search Service

</label>

<input
type="text"
id="searchService"
placeholder="Search by ID, Name or Category...">

</div>

</div>

<div
id="serviceList"
style="
max-height:450px;
overflow:auto;
border-radius:12px;
border:1px solid #374151;
background:#111827;
padding:10px;">

<p
style="
text-align:center;
color:#94a3b8;
padding:30px;">

No services loaded.

</p>

</div>

</div>

<script>

const API =
"https://gowind-smm-panel-v3.onrender.com";

let mode = "auto";

let allServices = [];

let selectedService = null;
  /* ===========================
   AUTO / MANUAL MODE
=========================== */

const modeBtn =
document.getElementById("modeBtn");

modeBtn.onclick=()=>{

if(mode==="auto"){

mode="manual";

modeBtn.innerHTML=
"⚪ Manual Fill";

[
"provider_service_id",
"name",
"category",
"rate",
"min",
"max"
].forEach(id=>{

document.getElementById(id).value="";

});

}else{

mode="auto";

modeBtn.innerHTML=
"🟢 Auto Fill";

if(selectedService){

fillForm(selectedService);

}

}

};

/* ===========================
   LIVE CATEGORY UPDATE
=========================== */

document
.getElementById("name")
.addEventListener(
"input",
e=>{

if(mode==="manual"){

document
.getElementById("category")
.value=
e.target.value;

}

}
);

/* ===========================
   LOAD PROVIDERS
=========================== */

async function loadProviders(){

try{

const res=
await fetch(
API+"/api/providers"
);

const data=
await res.json();

const provider=
document.getElementById(
"provider"
);

provider.innerHTML=
'<option value="">Select Provider</option>';

(data.providers||[])
.forEach(p=>{

provider.innerHTML+=`

<option value="${p.id}">
${p.name}
</option>

`;

});

}catch(err){

console.error(err);

}

}

/* ===========================
   FILL FORM
=========================== */

function fillForm(service){

selectedService=service;

document.getElementById(
"provider"
).value=
service.provider_id||"";

document.getElementById(
"provider_service_id"
).value=
service.provider_service_id||"";

document.getElementById(
"name"
).value=
service.name||"";

document.getElementById(
"category"
).value=
service.category||"";

document.getElementById(
"rate"
).value=
service.rate||0;

document.getElementById(
"min"
).value=
service.min||"";

document.getElementById(
"max"
).value=
service.max||"";

}
  /* ===========================
   LOAD SERVICES
=========================== */

async function loadServices(){

try{

const res=
await fetch(
API+"/api/services"
);

const data=
await res.json();

allServices=
data.services||[];

renderServices(
allServices
);

}catch(err){

console.error(err);

}

}

/* ===========================
   RENDER SERVICES
=========================== */

function renderServices(list){

const box=
document.getElementById(
"serviceList"
);

if(list.length===0){

box.innerHTML=`

<p style="
text-align:center;
padding:30px;
color:#94a3b8;
">

No Services Found

</p>

`;

return;

}

box.innerHTML="";

list.forEach(service=>{

box.innerHTML+=`

<div
class="service-item"
onclick="fillForm(${JSON.stringify(service).replace(/"/g,'&quot;')})"
style="
background:#1f2937;
border:1px solid #374151;
border-radius:12px;
padding:15px;
margin-bottom:12px;
cursor:pointer;
transition:.25s;
">

<b>

${service.provider_service_id}

</b>

<br>

${service.name}

<br>

<small
style="color:#94a3b8;">

${service.category}

</small>

</div>

`;

});

}

/* ===========================
   SEARCH SERVICE
=========================== */

document
.getElementById(
"searchService"
)
.addEventListener(
"input",
e=>{

const key=
e.target.value
.toLowerCase()
.trim();

const filtered=
allServices.filter(s=>

String(
s.provider_service_id
)
.includes(key)

||

(s.name||"")
.toLowerCase()
.includes(key)

||

(s.category||"")
.toLowerCase()
.includes(key)

);

renderServices(
filtered
);

}
);

/* ===========================
   REFRESH SERVICES
=========================== */

document
.getElementById(
"refreshServices"
)
.onclick=()=>{

loadServices();

};
  /* ===========================
   AUTO FILL FROM PROVIDER
=========================== */

async function autoFill(){

if(mode!=="auto") return;

const provider=
document.getElementById("provider").value;

const serviceId=
document.getElementById("provider_service_id").value;

if(!provider || !serviceId) return;

try{

const res=
await fetch(

API+
"/api/providers/"+
provider+
"/services"

);

const data=
await res.json();

const item=
(data.services||[])
.find(x=>

String(x.service)===

String(serviceId)

);

if(!item){

return;

}

document.getElementById("name").value=
item.name||"";

document.getElementById("category").value=
item.category||"";

document.getElementById("rate").value=
item.rate||0;

document.getElementById("min").value=
item.min||"";

document.getElementById("max").value=
item.max||"";

}catch(err){

console.error(err);

}

}

document
.getElementById("provider")
.onchange=autoFill;

document
.getElementById("provider_service_id")
.oninput=autoFill;

/* ===========================
   ADD PROVIDER
=========================== */

document
.getElementById("addProvider")
.onclick=async()=>{

try{

const res=
await fetch(
API+"/api/providers",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("provider_name").value.trim(),

api_url:
document.getElementById("api_url").value.trim(),

api_key:
document.getElementById("api_key").value.trim()

})

});

const data=
await res.json();

alert(
data.message||
"Provider Added Successfully"
);

document.getElementById("provider_name").value="";
document.getElementById("api_key").value="";

loadProviders();

}catch(err){

alert(err.message);

}

};

/* ===========================
   SAVE SERVICE
=========================== */

document
.getElementById("saveService")
.onclick=async()=>{

try{

const res=
await fetch(
API+"/api/services",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value
)

})

});

const data=
await res.json();

alert(
data.message||
"Service Saved Successfully"
);

loadServices();

}catch(err){

alert(err.message);

}

};
  /* ===========================
   UPDATE SERVICE
=========================== */

document
.getElementById("updateService")
.onclick=async()=>{

if(!selectedService){

alert("Select a service first");

return;

}

try{

const res=
await fetch(

API+
"/api/services/"+
selectedService.id,

{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

provider_id:Number(
document.getElementById("provider").value
),

provider_service_id:Number(
document.getElementById("provider_service_id").value
),

name:
document.getElementById("name").value.trim(),

category:
document.getElementById("category").value.trim(),

rate:Number(
document.getElementById("rate").value
),

min:Number(
document.getElementById("min").value
),

max:Number(
document.getElementById("max").value
),

status:true

})

});

const data=
await res.json();

alert(
data.message||
"Service Updated Successfully"
);

loadServices();

}catch(err){

alert(err.message);

}

};

/* ===========================
   DELETE SERVICE
=========================== */

document
.getElementById("deleteService")
.onclick=async()=>{

if(!selectedService){

alert("Select a service first");

return;

}

if(
!confirm(
"Delete this service?"
)
){

return;

}

try{

const res=
await fetch(

API+
"/api/services/"+
selectedService.id,

{

method:"DELETE"

}

);

const data=
await res.json();

alert(
data.message||
"Service Deleted Successfully"
);

selectedService=null;

[
"provider_service_id",
"name",
"category",
"rate",
"min",
"max"
].forEach(id=>{

document.getElementById(id).value="";

});

loadServices();

}catch(err){

alert(err.message);

}

};

/* ===========================
   PAGE LOAD
=========================== */

window.onload=()=>{

document
.getElementById("api_url").value=
"https://hyperpanel.in/api/v2";

loadProviders();

loadServices();

};

</script>

</body>

</html>
