<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Fund Requests</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1120;
color:#fff;
}

.container{
width:95%;
max-width:900px;
margin:25px auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.header h1{
font-size:28px;
}

.refreshBtn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.cards{
display:grid;
gap:18px;
}

.card{
background:#16213a;
padding:18px;
border-radius:16px;
border:1px solid #334155;
}

.row{
margin:8px 0;
}

.label{
color:#60a5fa;
font-weight:bold;
}

.status{
display:inline-block;
padding:6px 12px;
border-radius:20px;
margin-top:10px;
font-size:13px;
font-weight:bold;
}

.pending{
background:#f59e0b;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#fff;
}

.approveBtn{
background:#16a34a;
}

.rejectBtn{
background:#dc2626;
}

.empty{
text-align:center;
padding:40px;
font-size:18px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💰 Admin Fund Requests</h1>

<button class="refreshBtn"
onclick="loadRequests()">
Refresh
</button>

</div>

<div id="cards" class="cards">

<div class="empty">
Loading...
</div>

</div>

</div>
<script>

const API = "https://gowind-smm-panel-v3.onrender.com";

/* ===========================
   LOAD REQUESTS
=========================== */

async function loadRequests(){

try{

const response = await fetch(
API + "/api/admin/fund-requests"
);

const data = await response.json();

const cards = document.getElementById("cards");

cards.innerHTML = "";

if(!data.success){

cards.innerHTML =
"<div class='empty'>Failed to load requests</div>";

return;

}

const pendingRequests = data.requests.filter(function(item){

return item.status === "Pending";

});

if(pendingRequests.length === 0){

cards.innerHTML =
"<div class='empty'>No Pending Fund Requests</div>";

return;

}

pendingRequests.forEach(function(item){

cards.innerHTML += `

<div class="card" id="card-${item.id}">

<div class="row">

<span class="label">Request ID :</span>

${item.id}

</div>

<div class="row">

<span class="label">Username :</span>

${item.username}

</div>

<div class="row">

<span class="label">User ID :</span>

${item.user_id}

</div>

<div class="row">

<span class="label">Amount :</span>

₹${item.amount}

</div>

<div class="row">

<span class="label">UTR :</span>

${item.utr}

</div>

<div class="row">

<span class="label">Date :</span>

${new Date(item.created_at).toLocaleString()}

</div>

<div class="status pending">

Pending

</div>

<div class="actions">

<button
class="approveBtn"
onclick="updateRequest(${item.id},'Approved')">

✅ Approve

</button>

<button
class="rejectBtn"
onclick="updateRequest(${item.id},'Rejected')">

❌ Reject

</button>

</div>

</div>

`;

});

}catch(err){

document.getElementById("cards").innerHTML =
"<div class='empty'>Server Error</div>";

console.log(err);

}
  /* ===========================
   APPROVE / REJECT
=========================== */

async function updateRequest(id,status){

let note = "";

if(status === "Rejected"){

note = prompt("Reject Reason") || "";

}

try{

const response = await fetch(

API + "/api/fund-request/" + id,

{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

status:status,
admin_note:note

})

}

);

const data = await response.json();

if(data.success){

// Hide card immediately
const card = document.getElementById("card-" + id);

if(card){

card.remove();

}

// If no cards left
if(document.querySelectorAll(".card").length === 0){

document.getElementById("cards").innerHTML =
"<div class='empty'>No Pending Fund Requests</div>";

}

alert("Request " + status);

}else{

alert(
data.message ||
data.error ||
"Update Failed"
);

}

}catch(err){

alert(err.message);

}

}

/* ===========================
   AUTO LOAD
=========================== */

window.onload = function(){

loadRequests();

};

/* ===========================
   AUTO REFRESH
=========================== */

setInterval(function(){

loadRequests();

},10000);
  /* ===========================
   REFRESH BUTTON
=========================== */

function refreshRequests(){

loadRequests();

}

/* ===========================
   ESC KEY RELOAD
=========================== */

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

loadRequests();

}

});

console.log("Admin Fund Requests Ready");

</script>

</body>
</html>
