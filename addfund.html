<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Fund</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{
background:#08111f;
color:#fff;
min-height:100vh;
background-image:
radial-gradient(circle at top left,rgba(59,130,246,.18),transparent 35%),
radial-gradient(circle at bottom right,rgba(6,182,212,.15),transparent 40%);
}

.container{
width:95%;
max-width:520px;
margin:20px auto;
padding-bottom:40px;
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
margin-bottom:20px;
}

.backBtn{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.08);
color:#fff;
font-size:18px;
cursor:pointer;
}

.title{
flex:1;
text-align:center;
}

.title h2{
font-size:24px;
font-weight:700;
background:linear-gradient(90deg,#3b82f6,#06b6d4);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.title p{
margin-top:5px;
font-size:13px;
color:#94a3b8;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:22px;
margin-bottom:20px;
backdrop-filter:blur(15px);
}

.cardTitle{
font-size:20px;
font-weight:700;
text-align:center;
margin-bottom:18px;
}

.walletAmount{
font-size:40px;
font-weight:800;
text-align:center;
color:#22c55e;
}

.walletLabel{
text-align:center;
margin-top:10px;
font-size:14px;
color:#94a3b8;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
color:#fff;
font-size:16px;
outline:none;
margin-bottom:18px;
}

input:focus{
border-color:#3b82f6;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:16px;
font-weight:700;
color:#fff;
background:linear-gradient(90deg,#2563eb,#8b5cf6);
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

.qrBox{
display:flex;
justify-content:center;
margin:20px 0;
}

#qrImage{
width:220px;
height:220px;
background:#fff;
padding:10px;
border-radius:16px;
}

.upiRow{
display:flex;
gap:10px;
}

.upiRow input{
flex:1;
margin-bottom:0;
}

.copyBtn{
width:110px;
background:#16a34a;
}

.infoText{
margin-top:15px;
text-align:center;
font-size:14px;
color:#94a3b8;
}

#preview{
display:none;
width:100%;
margin-top:15px;
border-radius:14px;
}

#submitRequest{
margin-top:20px;
background:linear-gradient(90deg,#22c55e,#16a34a);
}

.emptyBox{
text-align:center;
padding:40px 20px;
color:#94a3b8;
}

.requestItem{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:15px;
margin-bottom:15px;
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#111827;
color:#fff;
padding:14px 24px;
border-radius:12px;
display:none;
z-index:999;
}

.toast.show{
display:block;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<button class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="title">

<h2>Add Fund</h2>

<p>Wallet Recharge</p>

</div>

<div style="width:45px;"></div>

</div>

<div class="card">

<div class="cardTitle">
Wallet Balance
</div>

<div
id="walletBalance"
class="walletAmount">

₹0.00

</div>

<div class="walletLabel">

Available Balance

</div>

</div>

<div class="card">

<div class="cardTitle">

Recharge Wallet

</div>

<label>

Amount (₹)

</label>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<button id="generateQR">

Generate QR Code

</button>

</div>
<!-- ===========================
QR PAYMENT
=========================== -->

<div
class="card"
id="qrCard"
style="display:none;">

<div class="cardTitle">

Scan & Pay

</div>

<div class="qrBox">

<img
id="qrImage"
src=""
alt="QR Code">

</div>

<label>

UPI ID

</label>

<div class="upiRow">

<input
type="text"
id="upiId"
readonly>

<button
type="button"
id="copyUPI"
class="copyBtn">

Copy

</button>

</div>

<p class="infoText">

Scan the QR or use the UPI ID to complete your payment.

</p>

</div>

<!-- ===========================
PAYMENT PROOF
=========================== -->

<div
class="card"
id="paymentCard"
style="display:none;">

<div class="cardTitle">

Payment Proof

</div>

<label>

UTR Number

</label>

<input
type="text"
id="utr"
placeholder="Enter UTR Number">

<label>

Payment Screenshot

</label>

<input
type="file"
id="screenshot"
accept="image/*">

<img
id="preview"
alt="Screenshot Preview">

<button
id="submitRequest">

Submit Request

</button>

</div>
<!-- ===========================
MY FUND REQUESTS
=========================== -->

<div class="card">

<div class="cardTitle">

My Fund Requests

</div>

<div id="requestList">

<div class="emptyBox">

<i class="fa-regular fa-folder-open"
style="font-size:50px;margin-bottom:15px;"></i>

<p>

No Fund Requests Found

</p>

</div>

</div>

</div>

<!-- ===========================
TOAST MESSAGE
=========================== -->

<div
id="toast"
class="toast">

Success

</div>

</div>
<!-- container end -->

<script>

/* JavaScript Part 4 Starts Here */
/* ===========================
CONFIG
=========================== */

const API = "https://gowind-smm-panel-v3.onrender.com";

const TOKEN = localStorage.getItem("token");

const USER = JSON.parse(
localStorage.getItem("user")
);

/* ===========================
LOGIN CHECK
=========================== */

if (!TOKEN || !USER) {

location.href = "login.html";

}

/* ===========================
ELEMENTS
=========================== */

const walletBalance =
document.getElementById("walletBalance");

const amount =
document.getElementById("amount");

const qrCard =
document.getElementById("qrCard");

const paymentCard =
document.getElementById("paymentCard");

const qrImage =
document.getElementById("qrImage");

const upiId =
document.getElementById("upiId");

const copyUPI =
document.getElementById("copyUPI");

const screenshot =
document.getElementById("screenshot");

const preview =
document.getElementById("preview");

const toast =
document.getElementById("toast");

const requestList =
document.getElementById("requestList");

/* ===========================
SHOW TOAST
=========================== */

function showToast(message){

toast.innerText = message;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2500);

}

/* ===========================
LOAD WALLET
=========================== */

async function loadWallet(){

try{

const res = await fetch(

API + "/api/wallet/" + USER.id,

{

headers:{

Authorization:
"Bearer " + TOKEN

}

}

);

const data = await res.json();

if(data.success){

walletBalance.innerHTML =
"₹" +
Number(data.wallet).toFixed(2);

}

}catch(err){

console.error(err);

showToast("Wallet Load Failed");

}

}

/* ===========================
LOAD SETTINGS
=========================== */

let UPI = "";

async function loadSettings(){

try{

const res = await fetch(

API + "/api/settings"

);

const data = await res.json();

if(data.success){

UPI = data.settings.upi_id;

}

}catch(err){

console.error(err);

}

}

/* ===========================
GENERATE QR
=========================== */

document
.getElementById("generateQR")
.onclick = function(){

const value = Number(amount.value);

if(value <= 0){

showToast("Enter Amount");

return;

}

qrCard.style.display = "block";

paymentCard.style.display = "block";

upiId.value = UPI;

const upiLink =

"upi://pay?pa=" +

UPI +

"&pn=SMM Panel&am=" +

value +

"&cu=INR";

qrImage.src =

"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +

encodeURIComponent(upiLink);

};

/* ===========================
COPY UPI
=========================== */

copyUPI.onclick = async()=>{

await navigator.clipboard.writeText(UPI);

showToast("UPI Copied");

};

/* ===========================
IMAGE PREVIEW
=========================== */

screenshot.onchange = (e)=>{

const file = e.target.files[0];

if(!file) return;

preview.src = URL.createObjectURL(file);

preview.style.display = "block";

};
/* ===========================
SUBMIT FUND REQUEST
=========================== */

document
.getElementById("submitRequest")
.onclick = async function(){

const value = Number(amount.value);

const utr =
document
.getElementById("utr")
.value.trim();

const file =
document
.getElementById("screenshot")
.files[0];

if(value <= 0){

showToast("Enter Amount");

return;

}

if(utr === ""){

showToast("Enter UTR Number");

return;

}

if(!file){

showToast("Select Screenshot");

return;

}

const formData = new FormData();

formData.append(
"user_id",
USER.id
);

formData.append(
"amount",
value
);

formData.append(
"utr",
utr
);

formData.append(
"screenshot",
file
);

try{

const res = await fetch(

API + "/api/fund-request",

{

method:"POST",

headers:{

Authorization:
"Bearer " + TOKEN

},

body:formData

}

);

const data =
await res.json();

if(data.success){

showToast(
"Request Submitted"
);

amount.value="";

document
.getElementById("utr")
.value="";

document
.getElementById("screenshot")
.value="";

preview.src="";

preview.style.display="none";

qrCard.style.display="none";

paymentCard.style.display="none";

loadHistory();

}else{

showToast(

data.message ||

"Request Failed"

);

}

}catch(err){

console.error(err);

showToast("Server Error");

}

};
/* ===========================
LOAD HISTORY
=========================== */

async function loadHistory(){

try{

const res = await fetch(

API + "/api/fund-request/" + USER.id,

{
headers:{
Authorization:"Bearer " + TOKEN
}
}

);

const data = await res.json();

if(!data.success || !data.requests){

requestList.innerHTML = `
<div class="emptyBox">
<i class="fa-regular fa-folder-open"
style="font-size:50px;margin-bottom:15px;"></i>
<p>No Fund Requests Found</p>
</div>
`;

return;

}

let html = "";

data.requests.forEach(item=>{

let statusClass = "pending";

if(item.status === "Approved")
statusClass = "approved";

if(item.status === "Rejected")
statusClass = "rejected";

html += `

<div class="requestItem">

<div class="requestTop">

<div class="requestAmount">
₹${item.amount}
</div>

<div class="status ${statusClass}">
${item.status}
</div>

</div>

<div class="requestRow">
<span>UTR</span>
<strong>${item.utr}</strong>
</div>

<div class="requestRow">
<span>Date</span>
<strong>
${new Date(item.created_at).toLocaleString()}
</strong>
</div>

</div>

`;

});

requestList.innerHTML = html;

}catch(err){

console.error(err);

requestList.innerHTML = `
<div class="emptyBox">
<p>Unable to load history.</p>
</div>
`;

}

}

/* ===========================
INITIAL LOAD
=========================== */

document.addEventListener(
"DOMContentLoaded",
async()=>{

await loadSettings();

await loadWallet();

await loadHistory();

});

/* ===========================
AUTO REFRESH
=========================== */

setInterval(()=>{

loadWallet();

loadHistory();

},30000);

/* ===========================
ONLINE / OFFLINE
=========================== */

window.addEventListener(
"offline",
()=>{

showToast("No Internet");

});

window.addEventListener(
"online",
()=>{

showToast("Connected");

loadWallet();

loadHistory();

});
/* ===========================
LOGOUT
=========================== */

function logout(){

localStorage.removeItem("token");
localStorage.removeItem("user");

location.href = "login.html";

}

/* ===========================
GLOBAL ERROR
=========================== */

window.addEventListener("error",(e)=>{

console.error(e.error);

showToast("Unexpected Error");

});

/* ===========================
API HEALTH CHECK
=========================== */

async function checkServer(){

try{

const res = await fetch(

API + "/health"

);

if(!res.ok){

console.warn("Server Offline");

}

}catch(err){

console.warn(err);

}

}

checkServer();

/* ===========================
END
=========================== */

console.log(
"Add Fund Ready"
);

</script>

</body>

</html>
